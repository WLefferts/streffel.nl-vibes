name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull and restart
        working-directory: /home/runner/streffel.nl-vibes
        run: |
          git pull --ff-only
          docker compose up -d --build --remove-orphans
          docker image prune -f